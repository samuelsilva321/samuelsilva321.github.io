<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vinil</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vinil: player de música no navegador. Suas músicas ficam salvas no seu aparelho.">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vinil">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
  /* v9 "Aurora": ambient colour follows the current track (--h). Library on the left as a clean list with tabs,
     player on the right: square sleeve with the record sliding out, big type, waveform scrubber. */
  :root{
    --h:200;
    --bg:#f4f1ec; --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.9); --line:rgba(30,26,22,.10);
    --ink:#1d1b18; --muted:#6f6a63; --wave-rest:rgba(30,26,22,.22); --ring-track:rgba(30,26,22,.12);
    --accent:hsl(var(--h) 82% 52%); --accent-soft:hsl(var(--h) 85% 55% / .16); --accent-text:hsl(var(--h) 80% 30%); --accent-ink:#fff;
    --glow-a:hsl(var(--h) 90% 70% / .45); --glow-b:hsl(calc(var(--h) + 60) 90% 72% / .30);
    --sh:0 30px 60px -30px rgba(40,30,20,.35); --sh-sm:0 8px 18px -10px rgba(40,30,20,.35);
    --focus:#0b6b8a;
    --f-display:'Red Hat Display',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-body:'Red Hat Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d0d10; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.10); --line:rgba(255,255,255,.09);
      --ink:#f3f1ee; --muted:#9a968f; --wave-rest:rgba(255,255,255,.22); --ring-track:rgba(255,255,255,.14);
      --accent:hsl(var(--h) 90% 64%); --accent-text:hsl(var(--h) 95% 74%); --accent-ink:#111;
      --glow-a:hsl(var(--h) 85% 50% / .38); --glow-b:hsl(calc(var(--h) + 60) 85% 45% / .24);
      --sh:0 30px 60px -30px rgba(0,0,0,.8); --sh-sm:0 8px 18px -10px rgba(0,0,0,.8);
      --focus:#7fd0ea; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0d10; --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.10); --line:rgba(255,255,255,.09);
    --ink:#f3f1ee; --muted:#9a968f; --wave-rest:rgba(255,255,255,.22); --ring-track:rgba(255,255,255,.14);
    --accent:hsl(var(--h) 90% 64%); --accent-text:hsl(var(--h) 95% 74%); --accent-ink:#111;
    --glow-a:hsl(var(--h) 85% 50% / .38); --glow-b:hsl(calc(var(--h) + 60) 85% 45% / .24);
    --sh:0 30px 60px -30px rgba(0,0,0,.8); --sh-sm:0 8px 18px -10px rgba(0,0,0,.8);
    --focus:#7fd0ea; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{background:var(--bg); overflow-x:hidden}
  html{overscroll-behavior:none; -webkit-text-size-adjust:100%}
  body{overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none}
  body, button, .row, .crow, .coll{-webkit-user-select:none; user-select:none}
  input, textarea{-webkit-user-select:text; user-select:text}
  img{-webkit-user-drag:none}
  body{
    margin:0; color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; min-height:100vh;
    background:
      radial-gradient(60% 50% at 82% 0%, var(--glow-a), transparent 70%),
      radial-gradient(55% 45% at 6% 100%, var(--glow-b), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    padding-block:20px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing:antialiased; transition:background-color .6s;
  }
  button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:12px}
  h1,h2,h3,p,ul{margin:0; padding:0}
  ul{list-style:none}
  svg{display:block}

  .stage{position:relative; z-index:1; max-width:1000px; margin-inline:auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; align-items:start}
  .ply{order:-1}
  .stage.dropping{outline:2px dashed var(--accent); outline-offset:10px; border-radius:36px}
  .panel{display:flex; flex-direction:column; gap:20px; min-width:0}
  .lib{
    background:var(--surface); border:1px solid var(--line); border-radius:34px; padding:26px 22px 22px; min-height:680px;
    -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3); box-shadow:var(--sh);
  }
  .ply{position:sticky; top:20px; padding:8px 6px 0; min-height:660px}

  /* Library */
  .ambient{position:fixed; inset:-12%; z-index:0; background-size:cover; background-position:center; filter:blur(70px) saturate(1.5); opacity:0; transition:opacity .8s, background-image .8s; pointer-events:none}
  .ambient.on{opacity:.38}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ambient.on{opacity:.26}}
  .card .eq{inset:auto; left:8px; bottom:8px; width:34px; height:34px; border-radius:50%}
  .eq{position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.4)}
  .eq b{display:flex; align-items:flex-end; gap:3px; height:16px}
  .eq i{display:block; width:3px; height:100%; border-radius:2px; background:#fff; transform:scaleY(.3); transform-origin:bottom}
  .is-playing .eq i{animation:eqb .9s ease-in-out infinite}
  .is-playing .eq i:nth-child(2){animation-delay:-.3s}
  .is-playing .eq i:nth-child(3){animation-delay:-.6s}
  @keyframes eqb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  .mini .thumb{position:relative; overflow:hidden}
  .next{display:flex; flex-direction:column; gap:8px; margin-top:6px}
  .next[hidden]{display:none}
  .next-h{font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); padding-inline:4px}
  .nextlist{display:flex; flex-direction:column; gap:2px}
  .nrow{display:flex; align-items:center; gap:12px; width:100%; padding:7px 8px; border-radius:16px; text-align:left; transition:background .2s}
  .nrow:hover{background:var(--surface)}
  .nrow .thumb{width:42px; height:42px; border-radius:12px}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
  .brand{font-family:var(--f-display); font-weight:800; font-size:40px; letter-spacing:-.045em; line-height:.95}
  .brand .o{display:inline-block; width:.74em; height:.74em; vertical-align:-.04em; margin-right:.12em; color:var(--accent)}
  .hello{font-size:12.5px; color:var(--muted); margin-top:6px; font-weight:500}
  .add{
    display:inline-flex; align-items:center; gap:7px; height:42px; padding:0 18px 0 14px; border-radius:999px; font-weight:700; font-size:14px;
    background:var(--ink); color:var(--bg); transition:transform .2s;
  }
  .add svg{width:14px; height:14px}
  .head-r{display:flex; align-items:center; gap:10px}
  .me{width:42px; height:42px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
  .me svg{width:19px; height:19px}
  .gear svg{width:21px; height:21px; transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
  @media (max-width:430px){ .head .add{width:42px; padding:0; justify-content:center; flex:none} .head .add .add-t{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)} .head .add svg{width:16px; height:16px} .head-r{gap:8px} }
  .me span{display:none; font-family:var(--f-display); font-weight:700; font-size:18px}
  .me.on{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .me.on svg{display:none} .me.on span{display:block}
  .add:hover{transform:translateY(-1px)}

  .search{position:relative; display:block}
  .search svg{position:absolute; left:16px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--muted); pointer-events:none}
  .search input{
    width:100%; height:46px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font:inherit; font-size:14.5px; padding:0 16px 0 42px; outline:0; -webkit-appearance:none; appearance:none; transition:background .2s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{background:var(--surface-2); outline:2px solid var(--focus); outline-offset:2px}

  .linkbar{display:flex; gap:8px}
  .linkbar[hidden]{display:none}
  .yt-bar .field svg.yt-ic{width:22px; height:22px; left:12px}
  .yt-bar input{padding-left:44px !important}
  .yt-bar{margin-bottom:10px}
  .linkbar .field{position:relative; flex:1; min-width:0}
  .linkbar .field svg{position:absolute; left:15px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--muted); pointer-events:none}
  .linkbar input{
    width:100%; height:46px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font:inherit; font-size:14.5px; padding:0 14px 0 42px; outline:0; -webkit-appearance:none; appearance:none; transition:background .2s;
  }
  .linkbar input::placeholder{color:var(--muted)}
  .linkbar input:focus{background:var(--surface-2); outline:2px solid var(--focus); outline-offset:2px}
  .linkbar button{height:46px; padding:0 18px; border-radius:16px; font-weight:700; font-size:14px; background:var(--accent); color:var(--accent-ink); flex:none; transition:transform .2s}
  .linkbar button:hover{transform:translateY(-1px)}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:18px; background:var(--surface); border:1px solid var(--line)}
  .coll{display:flex; align-items:baseline; justify-content:center; gap:8px; height:42px; align-items:center; border-radius:14px; font-weight:700; font-size:14px; color:var(--muted); transition:background .25s, color .25s, box-shadow .25s}
  .coll .nm{font-weight:700}
  .coll .ct{font-size:11.5px; font-weight:600; opacity:.85; font-variant-numeric:tabular-nums}
  .coll[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); box-shadow:var(--sh-sm)}
  .cap{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding-inline:4px}

  .rows{display:flex; flex-direction:column; gap:4px}
  .row{display:flex; align-items:center; gap:8px; border-radius:20px; padding:8px 10px 8px 8px; border:1px solid transparent; transition:background .25s, border-color .25s}
  .row:hover{background:var(--surface)}
  .row.on{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
  .row.off .row-main{opacity:.5}
  .row-main{flex:1; min-width:0; display:flex; align-items:center; gap:13px; text-align:left}
  .thumb{
    width:48px; height:48px; border-radius:14px; flex:none; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 25% 20%, hsl(calc(var(--h) + 40) 95% 78%) 0 22%, transparent 55%),
      linear-gradient(145deg, hsl(var(--h) 80% 58%), hsl(calc(var(--h) + 60) 70% 34%));
    box-shadow:0 6px 12px -6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .txt{min-width:0; display:flex; flex-direction:column}
  .ttl{font-size:15px; font-weight:700; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row.on .ttl{color:var(--accent-text)}
  .sub2{font-size:12.5px; color:var(--muted); display:flex; gap:6px; align-items:center; overflow:hidden; white-space:nowrap}
  .sub2 .who{overflow:hidden; text-overflow:ellipsis}
  .tag{font-size:8.5px; font-weight:800; letter-spacing:.1em; border-radius:5px; padding:1px 4px; flex:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--muted) 50%, transparent)}
  .pbtn{width:36px; height:36px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); transition:transform .2s, background .25s}
  .pbtn:hover{transform:scale(1.07)}
  .pbtn svg{width:15px; height:15px}
  .row.on .pbtn{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .rm{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; color:var(--muted)}
  .rm svg{width:13px; height:13px}
  .rm-q{font-size:17px; line-height:1.4; margin:4px 0 6px}
  .rm-sh .xs-body{display:grid; gap:10px}
  .rm-sh .btn-pri.rm-sim{background:#ff5c5c; color:#fff}
  .sl-rm .sl-n{color:#ff7a7a}
  .sl-rm .sl-c svg{width:14px; height:14px; color:#ff7a7a}
  .mi.mi-rm{color:#ff7a7a}
  .mi[hidden], .mh[hidden]{display:none}
  .rm:hover{color:var(--accent-text)}
  @media (hover:hover){ .rm{opacity:0; transition:opacity .2s} .row:hover .rm, .row:focus-within .rm{opacity:1} }
  .empty{padding:30px 12px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5}
  .msg{font-size:13px; font-weight:600; color:var(--accent-text); text-align:center}
  .foot{font-size:11.5px; color:var(--muted); line-height:1.55; padding-inline:4px; margin-top:auto}

  /* Mini player (phones) */
  .mini{
    display:none; position:sticky; bottom:max(10px, env(safe-area-inset-bottom, 0px)); z-index:4; overflow:hidden;
    align-items:center; gap:6px; padding:8px 8px 8px 8px; border-radius:22px;
    background:color-mix(in srgb, var(--bg) 70%, var(--surface-2)); border:1px solid var(--line); box-shadow:var(--sh);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  }
  .mini-main{flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left}
  .mini .thumb{width:42px; height:42px; border-radius:12px}
  .mini-btn{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex:none}
  .mini-btn svg{width:18px; height:18px}
  .mini-btn.play{background:var(--accent); color:var(--accent-ink)}
  .mini-bar{position:absolute; left:0; bottom:0; height:2px; width:0; background:var(--accent)}
  .mini[hidden]{display:none !important}

  /* Player */
  .top-ply{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px}
  .top-ply h2{font-size:11px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; text-align:center; color:var(--muted)}
  .round{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); transition:transform .2s; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
  .round:hover{transform:translateY(-1px)}
  .round svg{width:19px; height:19px}
  .back{visibility:hidden}
  .heart[aria-pressed="true"]{color:var(--accent)}
  .heart[aria-pressed="true"] svg{fill:currentColor}

  /* Sleeve + record */
  .sleeve-wrap{position:relative; width:min(100%, 330px); margin-inline:auto; aspect-ratio:1.18; display:flex; align-items:center}
  .vinyl{position:absolute; right:0; top:50%; width:74%; aspect-ratio:1; transform:translate(0,-50%); transition:transform .9s cubic-bezier(.3,.7,.2,1); filter:drop-shadow(0 14px 18px rgba(0,0,0,.4))}
  .vinyl{transform:translate(-20%,-50%)}
  .is-playing .vinyl{transform:translate(3%,-50%)}
  .disc{width:100%; height:100%; animation:spin 6s linear infinite; animation-play-state:paused}
  .is-playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ytbox{position:absolute; inset:0; z-index:4; border-radius:22px; overflow:hidden; background:#000; box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
  .ytbox[hidden]{display:none}
  .ytbox iframe{display:block; width:100%; height:100%; border:0}
  .yt-on .sleeve-wrap .vinyl, .yt-on .sleeve-wrap .cover, .yt-on .sleeve-wrap .vidbtn{visibility:hidden}
  .tag.yt{background:#ff3b30; color:#fff}
  .cover{
    position:relative; z-index:2; width:72%; aspect-ratio:1; border-radius:26px; overflow:hidden; box-shadow:0 30px 50px -22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3);
    background:
      radial-gradient(circle at 24% 18%, hsl(calc(var(--h) + 45) 95% 80%) 0 14%, transparent 48%),
      radial-gradient(circle at 80% 90%, hsl(calc(var(--h) + 120) 80% 55% / .75), transparent 55%),
      linear-gradient(150deg, hsl(var(--h) 82% 58%), hsl(calc(var(--h) + 60) 72% 28%));
    transition:background .6s;
  }
  .cover > svg{position:absolute; inset:0; width:100%; height:100%; opacity:.55}
  .cover{border:0; padding:0; display:block; cursor:pointer; background-clip:padding-box}
  .cover.has-art > svg, .cover.has-art .mono{display:none}
  .cover .cam{position:absolute; right:10px; bottom:10px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(0,0,0,.38); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .cover .cam svg{position:static; width:17px; height:17px; opacity:1}
  .is-playing .cover{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.022)}}
  .cover .mono{position:absolute; left:14px; bottom:12px; font-family:var(--f-display); font-weight:800; font-size:12px; letter-spacing:.16em; color:rgba(255,255,255,.85); text-transform:uppercase}

  .meta{text-align:center; min-height:66px}
  .meta h3{font-family:var(--f-display); font-weight:800; font-size:28px; letter-spacing:-.035em; line-height:1.1; overflow-wrap:anywhere; text-wrap:balance; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .meta p{color:var(--muted); font-size:14.5px; margin-top:5px; overflow-wrap:anywhere; font-weight:500}

  .wave{display:flex; flex-direction:column; gap:4px}
  .wave canvas{display:block; width:100%; height:72px; cursor:pointer; touch-action:none; border-radius:8px}
  .times{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-inline:2px; font-weight:600}

  .ctrl{display:flex; align-items:center; justify-content:center; gap:clamp(4px, 2vw, 12px)}
  .c-btn{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; flex:none; transition:transform .2s, background .2s}
  .c-btn:hover{transform:scale(1.08); background:var(--surface)}
  .c-btn svg{width:24px; height:24px}
  .c-ghost{position:relative; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--muted); flex:none; transition:background .2s, color .2s}
  .c-ghost svg{width:19px; height:19px}
  .c-ghost[aria-pressed="true"]{color:var(--accent-text); background:var(--accent-soft)}
  .c-ghost .one{position:absolute; font-size:9px; font-weight:800; right:5px; top:3px; display:none}
  .c-ghost.is-one .one{display:block}
  .play-wrap{position:relative; width:96px; height:96px; display:grid; place-items:center; flex:none}
  .play-ring{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .play-ring circle{transition:stroke-dashoffset .25s linear}
  .c-play{
    position:relative; z-index:1;
    width:78px; height:78px; border-radius:50%; display:grid; place-items:center; color:var(--accent-ink); background:var(--accent);
    box-shadow:0 18px 30px -12px var(--glow-a), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .2s, background .6s;
  }
  .c-play:hover{transform:scale(1.04)}
  .c-play:active{transform:scale(.96)}
  .c-play svg{width:30px; height:30px}

  .tools{display:flex; justify-content:center; gap:8px; flex-wrap:wrap}
  .chip{
    min-width:56px; height:38px; padding:0 14px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-size:13px; font-weight:700; background:var(--surface); border:1px solid var(--line); font-variant-numeric:tabular-nums; transition:transform .2s, color .2s, background .2s;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .chip:hover{transform:translateY(-1px); background:var(--surface-2)}
  .chip svg{width:15px; height:15px}
  .chip[aria-pressed="true"]{color:var(--accent-text)}

  .vol{display:none; align-items:center; gap:10px; color:var(--muted); width:min(100%, 200px); margin-inline:auto}
  .vol svg{width:16px; height:16px; flex:none}
  @media (hover:hover){ .vol{display:flex} }
  .vol input{-webkit-appearance:none; appearance:none; background:transparent; width:100%; height:20px; margin:0; cursor:pointer; min-width:0}
  .vol input::-webkit-slider-runnable-track{height:3px; border-radius:2px; background:linear-gradient(to right, var(--accent) var(--pct,80%), var(--ring-track) var(--pct,80%))}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--ink); margin-top:-4.5px; border:0}
  .vol input::-moz-range-track{height:3px; border-radius:2px; background:var(--ring-track)}
  .vol input::-moz-range-progress{height:3px; border-radius:2px; background:var(--accent)}
  .vol input::-moz-range-thumb{width:12px; height:12px; border-radius:50%; background:var(--ink); border:0}

  @keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  /* Home / library content */
  .searchtop{display:flex; flex-direction:column; gap:10px}
  .searchtop[hidden]{display:none}
  .content{display:flex; flex-direction:column; gap:22px; min-width:0}
  .sec-h{font-family:var(--f-display); font-weight:800; font-size:20px; letter-spacing:-.03em; line-height:1.15}
  .sec-h.big{font-size:28px}
  .nav{display:flex; gap:6px}
  .nv{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:999px; font-weight:700; font-size:14px; color:var(--muted); background:var(--surface); border:1px solid var(--line); transition:background .2s, color .2s}
  .nv svg{width:18px; height:18px}
  .nv[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:transparent}
  .cov{position:relative; display:block; border-radius:12px; aspect-ratio:1; flex:none; overflow:hidden;
    background:
      radial-gradient(circle at 25% 20%, hsl(calc(var(--h) + 40) 95% 78%) 0 20%, transparent 55%),
      linear-gradient(145deg, hsl(var(--h) 80% 58%), hsl(calc(var(--h) + 60) 70% 32%));
    box-shadow:0 8px 16px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3)}
  .cov.fav{background:linear-gradient(135deg,#5b3df5,#9fb2ff); color:#fff; display:grid; place-items:center}
  .cov.fav svg{width:46%; height:46%}
  .quick{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .qi{display:flex; align-items:center; gap:10px; height:56px; padding-right:8px; border-radius:10px; text-align:left; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); min-width:0; transition:background .2s}
  .qi:hover{background:var(--accent-soft)}
  .qi .cov{width:56px; height:56px; border-radius:0; box-shadow:none}
  .qi .q{font-size:13px; font-weight:700; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-width:0}
  .shelf-sec{display:flex; flex-direction:column; gap:12px; min-width:0}
  .shelf-hd{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .more{font-size:12.5px; font-weight:700; color:var(--muted)}
  .more:hover{color:var(--accent-text)}
  .shelf{display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .shelf::-webkit-scrollbar{display:none}
  .card{flex:none; width:144px; text-align:left; scroll-snap-align:start; display:flex; flex-direction:column; gap:4px; min-width:0}
  .card .cov{width:100%; border-radius:14px; margin-bottom:6px; transition:transform .25s}
  .card:hover .cov{transform:translateY(-2px)}
  .cplay{position:absolute; right:8px; bottom:8px; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); box-shadow:0 6px 12px -6px rgba(0,0,0,.6); opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s}
  .cplay svg{width:15px; height:15px}
  .card:hover .cplay, .card:focus-visible .cplay, .card.on .cplay{opacity:1; transform:none}
  .ct1{font-size:13.5px; font-weight:700; letter-spacing:-.01em; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card.on .ct1{color:var(--accent-text)}
  .ct2{font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .crows{display:flex; flex-direction:column; gap:4px}
  .crow{display:flex; align-items:center; gap:13px; padding:8px; border-radius:16px; text-align:left; min-width:0; transition:background .2s}
  .crow:hover{background:var(--surface)}
  .crow .cov{width:56px; height:56px; border-radius:10px}
  .chead{display:flex; align-items:center; gap:12px}
  .chead-t{flex:1; min-width:0}
  .playall{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); flex:none; box-shadow:0 12px 20px -10px var(--glow-a); transition:transform .2s}
  .playall:hover{transform:scale(1.06)}
  .playall svg{width:22px; height:22px}
  .row .pbtn{display:none}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:16px; background:var(--surface); border:1px solid var(--line)}
  .seg button{height:38px; border-radius:12px; font-weight:700; font-size:14px; color:var(--muted); transition:background .2s, color .2s, box-shadow .2s}
  .seg button[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); box-shadow:var(--sh-sm)}
  .hint{font-size:13px; line-height:1.55; color:var(--muted); padding:2px 4px}
  .hint b{color:var(--ink)}
  .online-note{font-size:11.5px; color:var(--muted); padding-inline:4px}
  .spin{display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid var(--ring-track); border-top-color:var(--accent); animation:spin 0.8s linear infinite; vertical-align:-2px; margin-right:8px}
  .addpl.done{color:var(--accent-text)}
  .addpl{width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; color:var(--muted); transition:color .2s, background .2s}
  .addpl svg{width:15px; height:15px}
  .addpl:hover{color:var(--accent-text); background:var(--accent-soft)}
  .cov.newpl{background:var(--surface-2); color:var(--accent-text); border:1px dashed color-mix(in srgb, var(--ink) 25%, transparent); display:grid; place-items:center; box-shadow:none}
  .cov.newpl svg{width:46%; height:46%}
  .sheet{position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center}
  .sheet[hidden]{display:none}
  .sheet-bg{position:absolute; inset:0; background:rgba(10,8,6,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
  .sheet-card{
    position:relative; width:min(100%, 480px); max-height:80vh; max-height:80dvh; overflow:auto; border-radius:28px 28px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); background:var(--bg); border:1px solid var(--line);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:14px; animation:rise .3s cubic-bezier(.2,.7,.2,1)
  }
  @media (min-width:761px){ .sheet{align-items:center} .sheet-card{border-radius:28px} }
  .sheet-h{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .sheet-h h3{font-family:var(--f-display); font-weight:800; font-size:20px; letter-spacing:-.03em}
  .sheet-list{display:flex; flex-direction:column; gap:6px}
  .sheet-empty{color:var(--muted); font-size:14px; padding:6px 4px}
  .sl{display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; border-radius:16px; text-align:left; background:var(--surface); border:1px solid var(--line); transition:background .2s}
  .sl:hover{background:var(--surface-2)}
  .sl-n{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sl-c{font-size:12px; color:var(--muted); flex:none; font-weight:600}
  .sl.on{border-color:color-mix(in srgb, var(--accent) 45%, transparent); background:var(--accent-soft)}
  .sl.on .sl-c{color:var(--accent-text)}
  .sheet-form{display:flex; gap:8px}
  .sheet-form input{flex:1; min-width:0; height:46px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:15px; padding:0 14px; outline:0; -webkit-appearance:none; appearance:none}
  .sheet-form input:focus{outline:2px solid var(--focus); outline-offset:2px}
  .sheet-form button{height:46px; padding:0 20px; border-radius:14px; font-weight:700; background:var(--accent); color:var(--accent-ink); flex:none}

  /* Tablet/desktop: player on the left, library on the right, both always visible. */
  @media (max-width:980px){
    .stage{gap:18px}
    .lib{padding:22px 16px 18px}
    .brand{font-size:34px}
    .sleeve-wrap{width:min(100%, 290px)}
    .meta h3{font-size:25px}
  }
  /* Phones: library screen (home / search / library) with mini player + bottom bar; player opens full screen. */
  @media (max-width:760px){
    body{padding-block:0; padding-bottom:0}
    .stage{display:block}
    .lib{
      background:none; border:0; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; border-radius:0;
      min-height:100vh; min-height:100dvh; padding:18px 0 calc(150px + env(safe-area-inset-bottom, 0px));
    }
    .head{position:sticky; top:0; z-index:5; margin-inline:-16px; padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; align-items:center;
      background:color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px)}
    .lib{padding-top:0 !important; gap:16px}
    .stage[data-screen="library"] .ply{display:none}
    .stage[data-screen="player"] .lib{display:none}
    .ply{position:static; min-height:100vh; min-height:100dvh; padding:14px 0 18px; order:0; animation:rise .35s cubic-bezier(.2,.7,.2,1)}
    .back{visibility:visible; display:grid}
    .top-ply{grid-template-columns:44px 1fr 44px}
    .top-ply h2{text-align:center; padding-left:0}
    .sleeve-wrap{width:min(100%, 316px)}
    .nav{
      position:fixed; left:0; right:0; bottom:0; z-index:6; gap:0; justify-content:space-around;
      padding:8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
      background:color-mix(in srgb, var(--bg) 82%, transparent); border-top:1px solid var(--line);
      -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    }
    .nv{flex-direction:column; gap:3px; height:auto; padding:6px 10px; background:none; border:0; border-radius:12px; font-size:11px; flex:1; color:var(--muted)}
    .nv svg{width:24px; height:24px}
    .nv[aria-pressed="true"]{background:none; color:var(--ink)}
    .nv[aria-pressed="true"] svg{color:var(--accent)}
    .mini{
      display:flex; position:fixed; left:max(8px, env(safe-area-inset-left, 0px)); right:max(8px, env(safe-area-inset-right, 0px));
      bottom:calc(72px + env(safe-area-inset-bottom, 0px)); z-index:5; border-radius:12px; color:#fff;
      background:color-mix(in srgb, hsl(var(--h) 52% 30%) 92%, #000); border:0; box-shadow:0 14px 28px -12px rgba(0,0,0,.6);
    }
    .mini .ttl{color:#fff} .mini .sub2{color:rgba(255,255,255,.72)}
    .mini-btn.play{background:#fff; color:#111}
    .mini-bar{background:#fff; height:2px}
    .mini .thumb{border-radius:8px}
    .shelf{margin-inline:-16px; padding-inline:16px; scroll-padding-inline:16px}
  }
  @media (max-width:380px){
    .play-wrap{width:84px; height:84px}
    .c-play{width:68px; height:68px}
    .c-btn{width:44px; height:44px}
    .c-ghost{width:32px; height:32px}
    .meta h3{font-size:24px}
  }
  /* flutuando: botão Adicionar, atalhos e cards do início */
  @keyframes boia{0%,100%{translate:0 0} 50%{translate:0 -6px}}
  /* cada um flutua de um jeito */
  @keyframes boiaLado{0%,100%{translate:-3px 0; rotate:-1deg} 50%{translate:3px -3px; rotate:1deg}}
  @keyframes boiaDiag{0%,100%{translate:0 0} 50%{translate:4px -7px}}
  @keyframes boiaGira{0%,100%{translate:0 -2px; rotate:1.2deg} 50%{translate:0 4px; rotate:-1.2deg}}
  @keyframes boiaOnda{0%,100%{translate:0 0} 25%{translate:2px -5px} 50%{translate:0 -8px} 75%{translate:-2px -4px}}
  @keyframes boiaPulo{0%,100%{translate:0 0; scale:1} 45%{translate:0 -7px; scale:1.02} 60%{translate:0 -5px; scale:1.015}}
  .add, .quick .qi, .home-float .card{animation:boia 4s ease-in-out infinite; will-change:translate, rotate}
  .quick .qi:nth-child(6n+1){animation-name:boia; animation-duration:4s}
  .quick .qi:nth-child(6n+2){animation-name:boiaLado; animation-duration:5.2s}
  .quick .qi:nth-child(6n+3){animation-name:boiaDiag; animation-duration:3.6s}
  .quick .qi:nth-child(6n+4){animation-name:boiaGira; animation-duration:4.6s}
  .quick .qi:nth-child(6n+5){animation-name:boiaOnda; animation-duration:5.8s}
  .quick .qi:nth-child(6n+6){animation-name:boiaPulo; animation-duration:3.2s}
  .home-float .card:nth-child(3n+2){animation-name:boiaGira; animation-duration:4.8s}
  .home-float .card:nth-child(3n+3){animation-name:boiaOnda; animation-duration:5.4s}
  .add{animation-name:boiaPulo}
  /* só Músicas curtidas flutua */
  .add, .quick .qi:not(:first-child), .home-float .card{animation:none !important; translate:none; rotate:none; scale:none}
  .quick .qi, .home-float .card .cov{box-shadow:0 10px 22px -12px rgba(0,0,0,.75)}
  .quick .qi{border-radius:22px}
  .quick .qi .cov{border-radius:22px 0 0 22px}
  .shelf .card .cov{border-radius:28px}
  .add{animation-duration:3.4s; box-shadow:0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent)}
  .home-float .shelf{padding-top:8px; margin-top:-8px; padding-bottom:18px; margin-bottom:-12px}
  @media (prefers-reduced-motion: reduce){
    .add, .quick .qi, .home-float .card{animation:none}
    .disc{animation:none}
    .is-playing .cover{animation:none}
    .is-playing .eq i{animation:none; transform:scaleY(.6)}
    .vinyl, .cover, body{transition:none}
    .stage[data-screen="library"] .lib, .stage[data-screen="player"] .ply{animation:none}
    .coll, .row, .pbtn, .round, .c-btn, .c-play, .add, .chip{transition:none}
  }

  /* ================= Layout "Noturno" =================
     Só interface e layout: tema escuro fixo, destaque verde-limão, Space Grotesk + Inter.
     O disco (.vinyl / .disc) e a capa (.cover) continuam exatamente como antes. */
  :root:root:root{
    --bg:#0e0f12; --surface:#1b1d22; --surface-2:#23252b; --line:#2a2d34; --line-2:#34373f;
    --ink:#f2f2f0; --muted:#9a9da5; --wave-rest:#3a3d45; --ring-track:#2a2d34;
    --accent:#c6f432; --accent-rgb:198,244,50; --accent-soft:rgba(198,244,50,.12); --accent-text:#c6f432; --accent-ink:#0e0f12;
    --glow-a:transparent; --glow-b:transparent;
    --sh:0 20px 40px -24px rgba(0,0,0,.85); --sh-sm:none; --focus:#c6f432;
    --f-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:dark;
  }
  body{background:var(--bg); font-size:14.5px}
  .ambient{display:none}

  /* Cabeçalho */
  .brand{font-weight:700; font-size:32px; letter-spacing:-.03em}
  .brand .o{color:var(--accent)}
  .add{height:40px; background:var(--accent); color:var(--accent-ink); font-weight:600}
  .sec-h{font-weight:700; font-size:20px; letter-spacing:-.01em}
  .sec-h.big{font-size:28px; letter-spacing:-.02em}
  .more{color:var(--accent); font-weight:600; font-size:13px}
  .more:hover{color:var(--accent); filter:brightness(1.15)}

  /* Painel da biblioteca (computador) */
  .lib{background:#15161a; border:1px solid #1f2127; border-radius:24px; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none}

  /* Abas como chips */
  .nv{height:36px; padding:0 16px; border-radius:18px; background:transparent; border:1px solid var(--line-2); color:var(--ink); font-weight:500}
  .nv[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
  .nv .on{display:none} .nv[aria-pressed="true"] .on{display:block} .nv[aria-pressed="true"] .off{display:none}
  .seg, .cols{display:flex; flex-wrap:wrap; gap:8px; padding:0; background:none; border:0; border-radius:0}
  .seg button, .coll{height:36px; padding:0 16px; border-radius:18px; border:1px solid var(--line-2); background:transparent; color:var(--ink); font-weight:500; font-size:14px; box-shadow:none}
  .seg button[aria-pressed="true"], .coll[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent; box-shadow:none; font-weight:600}
  .coll .ct{opacity:.75}

  /* Campos */
  .search input, .linkbar input, .sheet-form input{background:var(--surface); border-color:var(--line-2); border-radius:12px}
  .search input:focus, .linkbar input:focus{background:var(--surface-2)}
  .linkbar button, .sheet-form button{border-radius:12px; font-weight:600}

  /* Atalhos em grade (como o Noturno) */
  .quick{gap:8px}
  .qi{height:56px; border-radius:8px; background:var(--surface); border:0}
  .qi:hover{background:var(--surface-2)}
  .qi .q{font-size:13px; font-weight:600}

  /* Capas, cards e listas */
  .cov, .thumb{box-shadow:none}
  .cov.fav{background:#6c5ce7}
  .card{width:150px}
  .card .cov{border-radius:10px}
  .ct1{font-size:13px; font-weight:600}
  .cplay, .playall{box-shadow:none}
  .row, .crow{border-radius:10px}
  .row:hover, .crow:hover, .nrow:hover{background:var(--surface)}
  .row.on{background:var(--accent-soft); border-color:transparent}
  .thumb{border-radius:8px}
  .crow .cov{border-radius:6px}
  .ttl{font-weight:600}

  /* Player: tudo em volta do disco */
  .round{background:var(--surface); border:0; -webkit-backdrop-filter:none; backdrop-filter:none}
  .top-ply h2{letter-spacing:.16em; font-weight:600}
  .meta h3{font-weight:700; letter-spacing:-.02em}
  .c-btn:hover{background:var(--surface)}
  .c-play{box-shadow:none}
  .c-ghost[aria-pressed="true"]{color:var(--accent); background:var(--accent-soft)}
  .chip{background:var(--surface); border-color:var(--line-2); font-weight:600; -webkit-backdrop-filter:none; backdrop-filter:none}
  .chip:hover{background:var(--surface-2)}
  .chip[aria-pressed="true"]{color:var(--accent)}

  /* Vídeo da música (estilo Canvas) dentro da capa */
  .canvas-vid{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; pointer-events:none; z-index:1}
  .cover.has-vid .canvas-vid{display:block}
  .cover.has-vid > svg, .cover.has-vid .mono{display:none}
  .cover.has-vid{animation:none}
  .cover .cam{z-index:2}
  .vidbtn{position:absolute; z-index:3; left:10px; bottom:calc(7.5% + 10px); width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; background:rgba(0,0,0,.45); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .vidbtn svg{width:20px; height:20px}
  .vidbtn .v-del{display:none}
  .vidbtn.on .v-add{display:none}
  .vidbtn.on .v-del{display:block}

  /* Letra */
  .lyr-card{max-height:86vh; max-height:86dvh}
  .lyr-song{font-size:13px; color:var(--muted); margin-top:2px}
  .lyr-view{max-height:52vh; max-height:52dvh; overflow-y:auto; padding:24px 2px 40vh; scroll-behavior:smooth; outline:none; -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 32px); mask-image:linear-gradient(to bottom, transparent 0, #000 32px)}
  .lyr-view p{font-family:var(--f-display); font-weight:700; font-size:22px; line-height:1.35; color:var(--muted); opacity:.55; margin:0 0 12px; transition:color .3s, opacity .3s}
  .lyr-view p.on{color:var(--ink); opacity:1}
  .lyr-view p.done{opacity:.8}
  .lyr-view .lyr-empty{font-family:var(--f-body); font-weight:500; font-size:15px; opacity:1; color:var(--muted); padding:20px 0 0}
  .lyr-tip{display:block; font-size:13px; color:var(--muted); margin-bottom:8px}
  .lyr-edit textarea{width:100%; min-height:220px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font:inherit; font-size:15px; line-height:1.5; padding:12px; resize:vertical; outline:0}
  .lyr-edit textarea:focus{outline:2px solid var(--focus); outline-offset:2px}
  .lyr-actions{display:flex; gap:8px}
  .lyr-actions button{flex:1; height:46px; border-radius:12px; font-weight:600}

  .pl-hero svg{width:78px; height:78px; margin-bottom:8px; border-radius:20px; box-shadow:0 10px 30px -10px var(--accent)}
  .pl-k{font-size:11.5px; letter-spacing:.32em; font-weight:800; color:var(--muted)}
  .pl-t{font-family:var(--f-display); font-size:42px; font-weight:800; line-height:1; color:var(--accent)}
  .pl-sub, .pl-mot, .pl-ok{text-align:center; font-size:14.5px; line-height:1.45; margin:2px 8px 0}
  .pl-mot{font-weight:600}
  .pl-ok{color:var(--accent); font-weight:800}
  .pl-lista{list-style:none; display:grid; gap:13px; margin:4px 0 0; padding:16px; border-radius:18px; background:var(--surface)}
  .pl-lista li{display:flex; gap:13px; align-items:center}
  .pl-lista li > svg{width:22px; height:22px; flex:none; color:var(--accent)}
  .pl-lista b{display:block; font-size:14.5px}
  .pl-lista small{display:block; font-size:12.5px; color:var(--muted)}
  .pl-teste{font-size:12.5px; color:var(--muted); text-align:center}
  .pl-planos{display:grid; grid-template-columns:1fr; gap:10px; margin-top:6px}
  .pl-planos .pl-plano{justify-items:center; text-align:center}
  .pl-plano{position:relative; display:grid; gap:2px; justify-items:start; text-align:left; padding:14px; border-radius:16px; background:var(--surface); border:2px solid transparent}
  .pl-plano[aria-pressed="true"]{border-color:var(--accent)}
  .pl-plano em{position:absolute; top:-9px; right:10px; padding:2px 8px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-style:normal; font-size:9px; font-weight:800; letter-spacing:.1em}
  .pl-pn{font-size:12.5px; color:var(--muted); font-weight:700}
  .pl-plano strong{font-family:var(--f-display); font-size:22px}
  .pl-plano small{font-size:11.5px; color:var(--muted)}
  .pl-cod{display:grid; grid-template-columns:1fr 90px; gap:8px}
  .pl-cod input{height:50px; border-radius:14px; padding:0 14px; background:var(--surface); color:var(--ink); border:1px solid var(--line); font:inherit; font-size:16px; letter-spacing:.08em}
  .pl-link{display:block; margin:0 auto; padding:6px 10px; font-size:13px; color:var(--muted); text-decoration:underline}
  .ap-hero{display:grid; place-items:center; padding-top:2px}
  .ap-hero svg{width:54px; height:54px; color:var(--accent)}
  .ap-t{text-align:center; font-family:var(--f-display); font-size:24px; font-weight:800}
  .ap-s{text-align:center}
  .ap-vals{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}
  .ap-v{height:46px; border-radius:14px; background:var(--surface); font-weight:800; font-size:14px; border:2px solid transparent}
  .ap-v[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
  .ap-pix{padding:12px 14px; border-radius:14px; border:1.5px dashed var(--line); font-size:13px; color:var(--muted); word-break:break-all; line-height:1.45}
  .ap-pix b{color:var(--ink)}
  .mh{font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:8px 2px -2px}
  .mh:first-child{margin-top:0}
  .pf-dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-2); flex:none; box-sizing:border-box}
  .mi[aria-pressed="true"] .pf-dot{border:7px solid var(--accent)}
  .mi.pf > svg{width:22px; height:22px; flex:none; color:var(--accent)}
  .cov.folder{background:var(--surface-2); color:var(--accent); display:grid; place-items:center; box-shadow:none}
  .cov.folder svg{width:46%; height:46%}
  .cov.folder.warn{color:#ffb547}
  .fd-in{width:100%; height:50px; border-radius:12px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font:inherit; font-size:16px; padding:0 14px; outline:0; -webkit-appearance:none; appearance:none}
  .fd-in:focus{outline:2px solid var(--focus); outline-offset:2px}
  .ded-msg{height:auto; min-height:110px; padding:12px 14px; line-height:1.5; resize:vertical}
  .glow{position:fixed; inset:-25%; z-index:0; pointer-events:none; opacity:0; transition:opacity 1s;
    background:radial-gradient(35% 30% at 30% 30%, var(--g1, transparent), transparent 70%), radial-gradient(40% 35% at 70% 65%, var(--g2, transparent), transparent 70%), radial-gradient(30% 30% at 55% 42%, var(--g3, transparent), transparent 70%);
    filter:blur(40px); animation:glowMove 16s ease-in-out infinite alternate; animation-play-state:paused}
  body:has(.stage.is-playing) .glow{animation-play-state:running}
  @media (max-width:760px){ body:has(.stage[data-screen="player"]) .glow.on{opacity:.5} }
  @media (min-width:761px){ .glow.on{opacity:.3} }
  @keyframes glowMove{0%{transform:translate(0,0) rotate(0deg) scale(1)} 50%{transform:translate(6%,-4%) rotate(25deg) scale(1.1)} 100%{transform:translate(-5%,5%) rotate(-20deg) scale(1.05)}}
  @media (prefers-reduced-motion: reduce){ .glow{animation:none} }

  /* Janela de playlists */
  .sheet-card{background:var(--sheet, #15161a); border-color:var(--sheet-line, #1f2127)}
  .sl{background:var(--surface); border-color:transparent; border-radius:12px}
  .sl:hover{background:var(--surface-2)}

  /* Celular: barra de abas embaixo + mini player */
  @media (max-width:760px){
    .lib{background:none; border:0; border-radius:0}
    .head{background:color-mix(in srgb, var(--bg) 92%, transparent)}
    .brand{font-size:28px}
    .nav{background:var(--bg); border-top:1px solid #1f2127; -webkit-backdrop-filter:none; backdrop-filter:none}
    .nv, .nv[aria-pressed="true"]{height:auto; padding:6px 10px; border:0; border-radius:12px; background:none; font-size:11px}
    .nv{color:var(--muted); font-weight:500}
    .nv[aria-pressed="true"]{color:var(--accent); font-weight:600}
    .nv[aria-pressed="true"] svg{color:var(--accent)}
    .mini{background:var(--surface-2); color:var(--ink); border-radius:12px; padding:10px 8px 10px 10px; box-shadow:inset 0 -2px 0 #3a3d45, 0 14px 28px -12px rgba(0,0,0,.7)}
    .mini .ttl{color:var(--ink)}
    .mini .sub2{color:var(--muted)}
    .mini .thumb{width:44px; height:44px; border-radius:6px}
    .mini-btn.play{background:transparent; color:var(--ink)}
    .mini-bar{background:var(--accent)}
  }
</style>
</head>
<body>
<noscript><div style="font:600 15px/1.5 system-ui,sans-serif;padding:20px;margin:16px;border-radius:16px;background:#fff3cd;color:#4a3b00">O Vinil precisa de JavaScript para funcionar. Abra este endereço no Safari ou no Chrome.</div></noscript>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="stage" id="stage" data-screen="library">

  <!-- LIBRARY -->
  <section class="panel lib" aria-label="Biblioteca">
    <div class="head">
      <div>
        <h1 class="brand" aria-label="vinil"><svg class="o" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg>vinil</h1>
      </div>
      <div class="head-r">
        <button class="plus-b" type="button" id="plusBtn" aria-label="Conhecer o Vinil Plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.4 6.1 6.1 2.4-6.1 2.4L12 19.5l-2.4-6.1L3.5 11l6.1-2.4z"/></svg>PLUS</button>
        <button class="me gear" type="button" id="gearBtn" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <button class="me" type="button" id="meBtn" aria-label="Sua conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span></span></button>
        <button class="add" type="button" data-add><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="add-t">Adicionar</span></button>
      </div>
    </div>

    <nav class="nav" aria-label="Navegação">
      <button class="nv" type="button" data-view="home" aria-pressed="true">
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5H9v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M3.2 10.2 12 3l8.8 7.2V19a2.2 2.2 0 0 1-2.2 2.2H5.4A2.2 2.2 0 0 1 3.2 19zM9.8 21.2v-5.4h4.4v5.4z"/></svg><span>Início</span>
      </button>
      <button class="nv" type="button" data-view="search" aria-pressed="false">
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></g></svg><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.2" fill="currentColor" fill-opacity=".25"/><path d="m20 20-4.6-4.6"/></g></svg><span>Buscar</span>
      </button>
      <button class="nv" type="button" data-view="library" aria-pressed="false">
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="9" height="14" rx="1.8"/><path d="M12 6.9A6.5 6.5 0 1 1 12 17.1"/><circle cx="16" cy="12" r="1.4" fill="currentColor" stroke="none"/></g></svg><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="4.4" width="9.8" height="15.2" rx="2" fill="currentColor"/><path fill="currentColor" fill-rule="evenodd" d="M13.6 5.6A7.2 7.2 0 1 1 13.6 18.4zM16.2 10.4a1.6 1.6 0 1 0 .01 0z"/></svg><span>Sua biblioteca</span>
      </button>
      <button class="nv nv-chat" type="button" data-act="chat" aria-pressed="false" aria-label="Conversas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17.5H4A1.5 1.5 0 0 1 2.5 16V7A1.5 1.5 0 0 1 4 5.5z"/><path d="M7 10.5h10M7 13.5h6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg><span>Conversas</span><i class="ch-dot" hidden></i>
      </button>
    </nav>

    <div class="searchtop" id="searchTop" hidden>
      <div class="seg" id="seg" role="group" aria-label="Onde buscar">
        <button type="button" data-mode="lib" aria-pressed="true">Minha biblioteca</button>
        <button type="button" data-mode="online" aria-pressed="false">Online</button>
      </div>
      <form class="linkbar yt-bar" id="linkForm" autocomplete="off">
        <label class="field">
          <svg class="yt-ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="4.5" width="21" height="15" rx="4.5" fill="#ff0033"/><path d="M10 8.8v6.4l5.6-3.2z" fill="#fff"/></svg>
          <input type="url" id="linkInput" inputmode="url" enterkeyhint="go" placeholder="Link de música ou playlist do YouTube" aria-label="Link de música ou playlist do YouTube">
        </label>
        <button type="submit" id="linkBtn">Colar</button>
      </form>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="search" id="search" placeholder="Buscar música ou artista" aria-label="Buscar na biblioteca" autocomplete="off">
      </label>
    </div>

    <p class="msg" role="status" aria-live="polite" hidden></p>
    <div class="content" id="content"></div>
    <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wav" multiple hidden>
    <p class="foot">Suas músicas ficam salvas neste aparelho. Com a conta, suas playlists e ajustes vão junto para qualquer celular.</p>

    <div class="mini" id="mini" hidden>
      <button class="mini-main" id="miniOpen" type="button" aria-label="Abrir o player">
        <span class="thumb" id="miniThumb" style="--h:200"><span class="eq"><b><i></i><i></i><i></i></b></span></span>
        <span class="txt"><span class="ttl" id="miniTitle"></span><span class="sub2"><span class="who" id="miniArtist"></span></span></span>
      </button>
      <button class="mini-btn play" id="miniPlay" type="button" aria-label="Tocar">
        <svg id="miniIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.8v12.4L18.8 12z"/></svg>
      </button>
      <button class="mini-btn" id="miniNext" type="button" aria-label="Próxima faixa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6v12"/><path d="M6 6.5v11L14.5 12z"/></svg>
      </button>
      <i class="mini-bar" id="miniBar"></i>
    </div>
  </section>

  <!-- PLAYER -->
  <section class="panel ply" aria-label="Tocando agora">
    <header class="top-ply">
      <button class="round back" type="button" id="backBtn" aria-label="Voltar para a biblioteca">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <h2>Tocando agora</h2>
      <span class="pd-badge" aria-hidden="true"><i></i><b class="pd-bt" style="font:inherit">PAREDÃO LIGADO</b></span>
      <button class="round heart" type="button" id="pFav" aria-pressed="false" aria-label="Favoritar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-9.2C1.6 7.3 4 4 7.3 4c2 0 3.6 1.1 4.7 2.8C13.1 5.1 14.7 4 16.7 4 20 4 22.4 7.3 21 10.8 19 15.6 12 20 12 20z"/></svg>
      </button>
    </header>

    <div class="sleeve-wrap">
      <div class="vinyl">
        <svg class="disc" viewBox="0 0 300 300" aria-hidden="true">
          <circle cx="150" cy="150" r="149" fill="#0f1113"/>
          <g id="grooves" fill="none" stroke-width="1"></g>
          <circle cx="150" cy="150" r="148" fill="none" stroke="rgba(255,255,255,.14)"/>
          <path d="M150 22 A128 128 0 0 1 262 96" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M150 278 A128 128 0 0 1 38 204" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="3" stroke-linecap="round"/>
          <defs><clipPath id="lblClip"><circle cx="150" cy="150" r="56"/></clipPath></defs>

          <image id="lblImg" x="94" y="94" width="112" height="112" preserveAspectRatio="xMidYMid slice" clip-path="url(#lblClip)" visibility="hidden"/>
          <circle cx="150" cy="150" r="56" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
          <circle cx="150" cy="104" r="4.5" fill="#fff"/>
          <circle cx="150" cy="150" r="14" fill="#eef0f1"/>
          <circle cx="150" cy="150" r="4.5" fill="#9aa4a8"/>
        </svg>
      </div>
      <button class="cover" id="coverBtn" type="button" aria-label="Escolher a foto do cantor para esta música">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width=".6"><circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="24"/><circle cx="20" cy="20" r="34"/><circle cx="20" cy="20" r="44"/><circle cx="20" cy="20" r="54"/><circle cx="20" cy="20" r="64"/><circle cx="20" cy="20" r="74"/><circle cx="20" cy="20" r="84"/><circle cx="20" cy="20" r="94"/></g></svg>
        <span class="mono">vinil</span>
        <video class="canvas-vid" id="canvasVid" muted playsinline loop preload="auto" aria-hidden="true"></video>
        <span class="cam" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.4"/></svg></span>
      </button>
      <button class="vidbtn" id="vidBtn" type="button" aria-label="Colocar um vídeo nesta música">
        <svg class="v-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/></svg>
        <svg class="v-del" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/><path d="M6.5 9.5l6 5M12.5 9.5l-6 5"/></svg>
      </button>
      <div class="ytbox" id="ytBox" hidden></div>
      <div class="pd-box" id="pdBox" aria-hidden="true">
        <div class="pd-cab">
          <div class="pd-cone pd-tw"><i></i></div>
          <div class="pd-cone pd-wf"><i></i></div>
        </div>
        <div class="pd-bars" id="pdBars"></div>
      </div>
      <input id="coverInput" type="file" accept="image/*" hidden>
      <input id="vidInput" type="file" accept="video/*" hidden>
    </div>

    <div class="meta">
      <h3 id="pTitle">Nada tocando</h3>
      <p id="pArtist">Adicione músicas à fila</p>
    </div>

    <div class="wave">
      <canvas id="wave" role="slider" tabindex="0" aria-label="Posição da faixa" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></canvas>
      <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    </div>

    <div class="ctrl">
      <button class="c-ghost" id="shuffleBtn" type="button" aria-pressed="false" aria-label="Aleatório" title="Aleatório">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button class="c-btn" id="prevBtn" type="button" aria-label="Faixa anterior" title="Anterior">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 5.5v13" fill="none"/><path d="M18 6.5v11L9.5 12z"/></svg>
      </button>
      <div class="play-wrap">
        <svg class="play-ring" viewBox="0 0 104 104" aria-hidden="true">
          <circle cx="52" cy="52" r="50" fill="none" stroke="var(--ring-track)" stroke-width="2"/>
          <circle id="ringP" cx="52" cy="52" r="50" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" transform="rotate(-90 52 52)"/>
        </svg>
        <button class="c-play" id="playBtn" type="button" aria-label="Tocar" title="Tocar / pausar">
          <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.8v12.4L18.8 12z"/></svg>
        </button>

  var searchMode = 'lib';
  var online = { q:'', loading:false, error:'', results:null, item:null, itemLoading:false };
  var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7"/></svg>';
  function one(x){ return Array.isArray(x) ? String(x[0] || '') : String(x || ''); }
  function cleanQ(q){ return q.replace(/["():\[\]{}^~*?\\\/!&|+\-]/g, ' ').replace(/\s+/g, ' ').trim(); }
  function syncSeg(){
    Array.prototype.forEach.call(document.querySelectorAll('#seg button'), function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === searchMode));
    });
    el.search.placeholder = searchMode === 'online' ? 'Buscar artista ou música online' : 'Buscar música ou artista';
    el.search.setAttribute('enterkeyhint', searchMode === 'online' ? 'search' : 'done');
  }
  function onlineSearch(raw){
    var t = cleanQ(raw);
    online.item = null; online.error = '';
    if(!t){ online.results = null; online.q = ''; renderLib(); return; }
    online.q = t; online.loading = true; renderLib();
    var q = '(title:("' + t + '") OR creator:("' + t + '")) AND mediatype:audio';
    var url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(q) +
      '&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=creator&rows=30&page=1&output=json&sort%5B%5D=downloads+desc';
    fetch(url).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
      if(online.q !== t) return;
      online.results = (j && j.response && j.response.docs) || [];
    }).catch(function(){
      if(online.q !== t) return;
      online.results = null;
      online.error = 'Não consegui falar com o Internet Archive agora. Confira a internet e tente de novo.';
    }).then(function(){ if(online.q === t){ online.loading = false; if(view === 'search' && searchMode === 'online') renderLib(); } });
  }
  var EXT_RANK = { mp3:0, m4a:1, ogg:2, oga:2 };
  function openOnlineItem(doc){
    var it = { id:doc.identifier, title:one(doc.title) || doc.identifier, creator:one(doc.creator), files:null };
    online.item = it; online.itemLoading = true; online.error = ''; renderLib(); window.scrollTo(0, 0);
    fetch('https://archive.org/metadata/' + encodeURIComponent(doc.identifier)).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(j){
      if(online.item !== it) return;
      var by = {};
      (j.files || []).forEach(function(f){
        var m = /^(.*)\.(mp3|m4a|ogg|oga)$/i.exec(f.name || '');
        if(!m || /sample|spectrogram/i.test(f.name)) return;
        var rank = EXT_RANK[m[2].toLowerCase()], cur0 = by[m[1]];
        if(!cur0 || rank < cur0.rank) by[m[1]] = { rank:rank, f:f, base:m[1] };
      });
      var list = Object.keys(by).map(function(k){ return by[k]; });
      list.sort(function(a, b){
        var ta = parseInt(a.f.track, 10), tb = parseInt(b.f.track, 10);
        if(!isNaN(ta) && !isNaN(tb) && ta !== tb) return ta - tb;
        return a.f.name < b.f.name ? -1 : 1;
      });
      it.files = list.slice(0, 80).map(function(o){
        var path = o.f.name.split('/').map(encodeURIComponent).join('/');
        return { url:'https://archive.org/download/' + encodeURIComponent(it.id) + '/' + path,
                 title:(o.f.title || o.base.split('/').pop()).replace(/_/g, ' ').trim(), size:parseInt(o.f.size, 10) || 0 };
      });
      if(!it.creator && j.metadata) it.creator = one(j.metadata.creator);
    }).catch(function(){
      if(online.item !== it) return;
      online.error = 'Não consegui abrir este item. Tente outro ou busque de novo.';
      it.files = [];
    }).then(function(){ if(online.item === it){ online.itemLoading = false; renderLib(); } });
  }
  /* tocar em sequência: depois que uma faixa do álbum online acaba, toca a próxima do álbum */
  var ctx = null;
  function ctxIndex(){
    if(!ctx || cur < 0 || !tracks[cur]) return -1;
    var k = tracks[cur].key;
    for(var i = 0; i < ctx.files.length; i++) if('url:' + ctx.files[i].url === k) return i;
    return -1;
  }
  function ctxStep(dir, auto){
    var i = ctxIndex();
    if(i < 0) return false;
    var j = i + dir;
    if(j < 0) return false;
    if(j >= ctx.files.length){
      if(!auto) return false;
      if(repeat === 1){ addRemote(ctx.files[0], ctx.creator, true); return true; }
      playIntent = false; audio.pause(); audio.currentTime = 0; syncState();
      return true;
    }
    addRemote(ctx.files[j], ctx.creator, true);
    return true;
  }
  function addRemote(file, creator, play){
    var key = 'url:' + file.url, have = indexOfKey(key);
    if(have >= 0){ if(play) playIdx(have); return; }
    var t = { key:key, title:file.title, artist:creator || 'Internet Archive', source:'link', url:file.url, duration:null, peaks:null, added:Date.now() };
    tracks.push(t); persist(t);
    var probe = new Audio(); probe.preload = 'metadata';
    probe.onloadedmetadata = function(){ if(isFinite(probe.duration)) t.duration = probe.duration; };
    probe.src = file.url;
    if(file.size && file.size <= 12 * 1024 * 1024){
      try{ fetch(file.url, { mode:'cors' }).then(function(r){ return r.ok ? r.blob() : null; }).then(function(b){ if(b){ t.blob = b; queuePeaks(t); } }).catch(function(){}); }catch(e){}
    }
    renderLib();
    if(play) loadTrack(tracks.length - 1, true);
  }

  /* ---------- biblioteca salva no navegador (IndexedDB) ---------- */
  var dbp = null;
  function db(){
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      try{
        var r = indexedDB.open('rolo-lib', 2);
        r.onupgradeneeded = function(){
          var d = r.result;
          if(!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath:'key' });
          if(!d.objectStoreNames.contains('canvas')) d.createObjectStore('canvas', { keyPath:'key' });
        };
        r.onsuccess = function(){ res(r.result); };
        r.onerror = function(){ rej(r.error); };
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  function dbPut(rec){ db().then(function(d){ d.transaction('tracks', 'readwrite').objectStore('tracks').put(rec); }).catch(function(){}); }
  function dbDel(key){ db().then(function(d){ d.transaction('tracks', 'readwrite').objectStore('tracks').delete(key); }).catch(function(){}); }
  function dbAll(){
    return db().then(function(d){
      return new Promise(function(res){
        var q = d.transaction('tracks').objectStore('tracks').getAll();
        q.onsuccess = function(){ res(q.result || []); };
        q.onerror = function(){ res([]); };
      });
    }).catch(function(){ return []; });
  }
  function persist(t){
    if(t.source === 'local' && t.blob) dbPut({ key:t.key, title:t.title, artist:t.artist, source:'local', blob:t.blob, nuvem:t.nuvem || null, size:t.size || 0, added:t.added || Date.now() });
    else if(t.source === 'radio'){ dbPut({ key:t.key, title:t.title, artist:t.artist, source:'radio', url:t.url, art:t.art || null, site:t.site || null, semCors:!!t.semCors, added:t.added || Date.now() }); if(typeof ctMudou === 'function') ctMudou(); }
    else if(t.source === 'nuvem') dbPut({ key:t.key, title:t.title, artist:t.artist, source:'nuvem', nuvem:t.nuvem, size:t.size || 0, added:t.added || Date.now() });
    else if(t.source === 'link') dbPut({ key:t.key, title:t.title, artist:t.artist, source:'link', url:t.url, added:t.added || Date.now() });
    else if(t.source === 'yt'){ dbPut({ key:t.key, title:t.title, artist:t.artist, source:'yt', ytId:t.ytId, ytAuto:!!t.ytAuto, added:t.added || Date.now() }); if(typeof ctMudou === 'function') ctMudou(); }
  }
  function restoreSaved(){
    return dbAll().then(function(list){
      list.sort(function(a, b){ return (a.added || 0) - (b.added || 0); });
      var any = false;
      list.forEach(function(r){
        if(indexOfKey(r.key) >= 0) return;
        var t = { key:r.key, title:r.title, artist:r.artist, source:r.source, duration:null, peaks:null, added:r.added };
        if(r.source === 'yt' && r.ytId){ t.ytId = r.ytId; t.ytAuto = !!r.ytAuto; t.art = ytThumb(r.ytId); tracks.push(t); any = true; return; }
        if(r.source === 'radio' && r.url){ t.url = r.url; t.art = r.art || null; t.site = r.site || null; t.semCors = !!r.semCors; tracks.push(t); any = true; return; }
        if(r.source === 'nuvem' && r.nuvem){ t.nuvem = r.nuvem; t.size = r.size || 0; tracks.push(t); any = true; return; }
        if(r.source === 'local' && r.blob){ t.blob = r.blob; t.url = URL.createObjectURL(r.blob); t.nuvem = r.nuvem || null; t.size = r.size || r.blob.size || 0; }
        else if(r.source === 'link' && r.url){ t.url = r.url; }
        else return;
        tracks.push(t); any = true;
        var probe = new Audio(); probe.preload = 'metadata';
        probe.onloadedmetadata = function(){ if(isFinite(probe.duration)) t.duration = probe.duration; };
        probe.src = t.url;
        if(t.blob){ queuePeaks(t); readTags(t); }
      });
      if(any){ if(cur < 0 && tracks.length) loadTrack(0, false); renderLib(); }
      if(typeof nvAoAbrir === 'function') nvAoAbrir();
    });
  }

  function rrect(c, x, y, w, h, r){
    c.beginPath();
    if(c.roundRect){ c.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w / 2, h / 2);
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  /* rádio ao vivo: painel de LED de paredão no lugar da onda */
  var ledPico = [], ledNivel = [], ledData = null;
  function drawLed(){
    el.ringP.style.strokeDashoffset = '0';
    if(wW < 10) return;
    var cs = getComputedStyle(document.documentElement);
    var acc = cs.getPropertyValue('--accent').trim() || '#c6f432';
    var off = cs.getPropertyValue('--surface-2').trim() || '#23252b';
    var dim = cs.getPropertyValue('--wave-rest').trim() || '#3a3d45';
    var claro = document.documentElement.classList.contains('tema-claro');
    var rows = 6, gap = 4, r = Math.max(2.2, Math.min(4.2, (wH - (rows - 1) * gap) / rows / 2));
    var cell = r * 2 + gap, cols = Math.max(10, Math.floor((wW + gap) / cell));
    var x0 = (wW - (cols * cell - gap)) / 2 + r, y0 = (wH - (rows * cell - gap)) / 2 + r;
    var playing = !audio.paused && cur >= 0, now = performance.now();
    var real = playing && fx && fx.an && !(typeof rd !== 'undefined' && rd.on);
    if(real){ if(!ledData || ledData.length !== fx.an.frequencyBinCount) ledData = new Uint8Array(fx.an.frequencyBinCount); fx.an.getByteFrequencyData(ledData); }
    wctx.clearRect(0, 0, wW, wH);
    for(var c = 0; c < cols; c++){
      var alvo = 0;
      if(real){
        var a = Math.floor(Math.pow(c / cols, 1.7) * ledData.length * 0.7) + 1, b = Math.floor(Math.pow((c + 1) / cols, 1.7) * ledData.length * 0.7) + 2, sm = 0;
        for(var q = a; q < b; q++) sm += ledData[q] || 0;
        alvo = Math.min(1, sm / Math.max(1, b - a) / 210);
      } else if(playing){
        var bt = Math.pow(0.5 + 0.5 * Math.sin(now / 230), 3);
        alvo = 0.18 + 0.32 * (0.5 + 0.5 * Math.sin(now / 170 + c * 0.9)) * (0.6 + 0.4 * Math.sin(now / 410 - c * 0.31)) + 0.38 * bt * Math.exp(-c / cols * 1.6) + 0.12 * (0.5 + 0.5 * Math.sin(now / 61 + c * 2.7));
        alvo = Math.max(0, Math.min(1, alvo));
      }
      var atual = ledNivel[c] || 0;
      atual = alvo > atual ? atual + (alvo - atual) * 0.6 : atual * 0.86 + alvo * 0.14;
      ledNivel[c] = atual;
      var nv = Math.round(atual * rows);
      var pk = ledPico[c] || 0;
      if(nv >= pk) pk = nv; else pk = Math.max(0, pk - 0.06);
      ledPico[c] = pk;
      var pkRow = Math.round(pk);
      for(var rr = 0; rr < rows; rr++){
        var nivelLed = rows - rr, aceso = nivelLed <= nv, topo = playing && nivelLed === pkRow && pkRow > 0;
        var col = off, glow = 0;
        if(aceso || topo){ col = nivelLed === rows ? '#ff5a5a' : nivelLed === rows - 1 ? '#ffc93d' : acc; glow = topo && !aceso ? 4 : 8; }
        else if(!playing) col = rr === rows - 1 ? dim : off;
        wctx.shadowColor = glow ? col : 'transparent'; wctx.shadowBlur = claro ? 0 : glow;
        wctx.fillStyle = col;
        wctx.beginPath(); wctx.arc(x0 + c * cell, y0 + rr * cell, r, 0, Math.PI * 2); wctx.fill();
      }
    }
    wctx.shadowBlur = 0;
  }
  function drawWave(){
    if(tracks[cur] && tracks[cur].source === 'radio'){ drawLed(); return; }
    var d0 = durationNow();
    el.ringP.style.strokeDashoffset = String(314.16 * (1 - (d0 ? Math.max(0, Math.min(1, audio.currentTime / d0)) : 0)));
    if(wW < 10) return;
    var cs = getComputedStyle(document.documentElement);
    var played = cs.getPropertyValue('--ink').trim() || '#2b3d43';
    var rest = cs.getPropertyValue('--wave-rest').trim() || 'rgba(86,112,121,.36)';
    var acc = cs.getPropertyValue('--accent').trim() || '#e8502a';
    var t = tracks[cur], peaks = t && t.peaks, d = durationNow();
    var p = d ? Math.max(0, Math.min(1, audio.currentTime / d)) : 0;
    var bw = 2.6, step = bw + 3, n = Math.max(8, Math.floor((wW + 3) / step));
    var x0 = (wW - (n * step - 3)) / 2, mid = wH / 2, maxH = wH - 6;
    var head = Math.min(n - 1, Math.floor(p * n));
    wctx.clearRect(0, 0, wW, wH);
    var playing = !audio.paused && cur >= 0 && d > 0, now = performance.now(), zone = n * 0.07 + 4;
    var hue0 = parseFloat(cs.getPropertyValue('--h')) || 200;
    for(var i = 0; i < n; i++){
      var pk = peaks ? peaks[Math.min(PEAKS - 1, Math.floor(i / n * PEAKS))] : 0.14;
      var h = Math.max(bw, (0.1 + 0.9 * pk) * maxH), infl = 0, fill;
      if(playing){
        // a onda inteira dança: onda viajando + harmônico rápido, mais forte onde a música é mais forte
        var tw = 0.5 + 0.5 * Math.sin(now / 150 - i * 0.38);
        var fast = 0.5 + 0.5 * Math.sin(now / 67 + i * 1.9);
        var dd = (i - head) / zone;
        infl = Math.exp(-dd * dd);
        var k = 0.12 + (0.30 * tw + 0.16 * fast) * (0.35 + pk) + 0.45 * infl * fast;
        h = Math.max(bw, Math.min(maxH, h * 0.62 * (0.55 + k * 2.1)));
      }
      if(i === head && d) fill = acc;
      else if(i < head) fill = playing ? acc : played;
      else fill = rest;
      wctx.shadowColor = infl > 0.3 ? acc : 'transparent';
      wctx.shadowBlur = infl > 0.3 ? 14 * infl : 0;
      wctx.fillStyle = fill;
      rrect(wctx, x0 + i * step, mid - h / 2, bw, h, bw / 2);
      wctx.fill();
    }
    wctx.shadowBlur = 0;
  }
  function seekFromEvent(e){
    var r = el.wave.getBoundingClientRect(), d = durationNow();
    if(!d) return;
    var f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.currentTime = f * d; waveDirty = true;
  }
  el.wave.addEventListener('pointerdown', function(e){
    dragging = true;
    try{ el.wave.setPointerCapture(e.pointerId); }catch(x){}
    seekFromEvent(e);
  });
  el.wave.addEventListener('pointermove', function(e){ if(dragging) seekFromEvent(e); });
  ['pointerup', 'pointercancel'].forEach(function(ev){
    el.wave.addEventListener(ev, function(){ dragging = false; });
  });
  el.wave.addEventListener('keydown', function(e){
    var d = durationNow();
    if(!d) return;
    if(e.key === 'ArrowRight'){ audio.currentTime = Math.min(d, audio.currentTime + 5); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
    else if(e.key === 'Home'){ audio.currentTime = 0; e.preventDefault(); }
    else if(e.key === 'End'){ audio.currentTime = Math.max(0, d - 1); e.preventDefault(); }
    waveDirty = true;
  });

  function frame(){
    if(waveDirty || (!audio.paused && cur >= 0)){ waveDirty = false; drawWave(); }
    requestAnimationFrame(frame);
  }

  /* ---------- init ---------- */
  renderLib();
  syncState();
  loadTrack(0, false);
  restoreSaved().then(resumeLast, resumeLast);
  requestAnimationFrame(frame);
})();
</script>

if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
